<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>Nova AI</title>


<style>

body{

    margin:0;

    height:100vh;

    display:grid;

    place-items:center;

    background:#111;

    color:white;

    font-family:Arial;
}


.card{

    width:400px;

    padding:25px;

    text-align:center;

    background:#222;

    border:1px solid #444;

    border-radius:10px;
}


.top-row{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:12px;
}


.mic{

    width:75px;

    height:75px;

    border:0;

    border-radius:50%;

    font-size:30px;

    cursor:pointer;

    background:#eee;
}


.mic.listening{

    background:#aaa;
}


.tts{

    width:38px;

    height:38px;

    border:1px solid #444;

    border-radius:50%;

    background:#222;

    color:#ccc;

    cursor:pointer;

    font-size:15px;
}


.tts.on{

    background:#666;

    color:white;

    border-color:#666;
}


.status{

    margin:15px;

    color:#aaa;
}


.command{

    margin:10px;

    color:#ccc;
}


.editor{

    display:none;

    margin-top:20px;

    text-align:left;
}


.recipient{

    color:#aaa;

    font-size:13px;
}


.tone-label{

    color:#777;

    font-size:12px;

    margin-top:4px;
}


input,
textarea{

    width:100%;

    margin:6px 0;

    padding:10px;

    box-sizing:border-box;

    background:#111;

    color:white;

    border:1px solid #444;

    border-radius:5px;
}


textarea{

    height:130px;

    resize:vertical;
}


button.action{

    padding:10px 14px;

    margin-top:5px;

    border:0;

    border-radius:5px;

    cursor:pointer;
}


.primary{

    background:#666;

    color:white;
}


.history{

    margin-top:20px;

    text-align:left;

    border-top:1px solid #444;

    padding-top:10px;
}


.history-title{

    font-size:12px;

    color:#777;

    margin-bottom:6px;
}


.history-item{

    font-size:13px;

    color:#aaa;

    padding:3px 0;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

</style>

</head>


<body>


<div class="card">


<h2>Nova AI</h2>


<p>
    Say a song name or create an email
</p>


<div class="top-row">

    <button
        id="mic"
        class="mic"
    >
        🎙️
    </button>

    <button
        id="tts"
        class="tts"
        title="Toggle voice replies"
    >
        🔈
    </button>

</div>


<div
    id="status"
    class="status"
>
    Tap microphone
</div>


<div
    id="command"
    class="command"
></div>



<!-- Gmail Editor -->

<div
    id="editor"
    class="editor"
>


    <div
        id="recipient"
        class="recipient"
    ></div>


    <input
        id="subject"
        placeholder="Email subject"
    >


    <textarea
        id="body"
        placeholder="Email body"
    ></textarea>


    <div
        id="toneLabel"
        class="tone-label"
    ></div>


    <button
        id="open"
        class="action primary"
    >
        Open in Gmail
    </button>


    <button
        id="regen"
        class="action"
    >
        Regenerate
    </button>


</div>


<!-- Command history -->

<div class="history">

    <div class="history-title">
        Recent commands
    </div>

    <div id="historyList"></div>

</div>


</div>



<script>


// --------------------------------------------------
// DOM REFERENCES
// --------------------------------------------------

const $ =
    id => document.getElementById(id);


const mic =
    $("mic");


const ttsBtn =
    $("tts");


const status =
    $("status");


const commandBox =
    $("command");


const editor =
    $("editor");


const recipient =
    $("recipient");


const subject =
    $("subject");


const body =
    $("body");


const toneLabel =
    $("toneLabel");


const historyList =
    $("historyList");



// --------------------------------------------------
// SPEECH RECOGNITION
// --------------------------------------------------

const SR =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition;

let listening = false;



// --------------------------------------------------
// COMMAND / TONE / HISTORY STATE
// --------------------------------------------------

let lastCommand = "";

let generatingEmail = false;

let youtubeTab = null;

let ttsOn = false;

let currentTone = "formal";

const TONES = ["formal", "friendly", "concise"];

let commandHistory = [];



// --------------------------------------------------
// TEXT TO SPEECH
// --------------------------------------------------

function speak(text){

    if(!ttsOn) return;

    try{

        window.speechSynthesis.cancel();

        const utter =
            new SpeechSynthesisUtterance(text);

        window.speechSynthesis.speak(utter);

    }
    catch(e){

        console.log(e);
    }
}


function setStatus(text, alsoSpeak){

    status.textContent = text;

    if(alsoSpeak) speak(text);
}


ttsBtn.onclick = () => {

    ttsOn = !ttsOn;

    ttsBtn.classList.toggle("on", ttsOn);

    ttsBtn.textContent = ttsOn ? "🔊" : "🔈";

    if(ttsOn) speak("Voice replies on");
};



// --------------------------------------------------
// COMMAND HISTORY
// --------------------------------------------------

function addHistory(command, type){

    commandHistory.unshift({ command, type });

    commandHistory = commandHistory.slice(0, 5);

    historyList.innerHTML = commandHistory.map(h => {

        const icon =
            h.type === "email" ? "✉️" :
            h.type === "youtube" ? "🎵" :
            "❔";

        return `<div class="history-item">${icon} ${h.command}</div>`;

    }).join("");
}



// --------------------------------------------------
// SPEECH RECOGNITION SETUP
// --------------------------------------------------

if(!SR){

    setStatus(
        "Speech recognition unavailable"
    );

    mic.disabled = true;

}
else{

    recognition =
        new SR();


    recognition.lang =
        "en-US";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;



    recognition.onstart = () => {

        listening = true;

        mic.classList.add(
            "listening"
        );

        setStatus(
            "Listening..."
        );

    };



    recognition.onend = () => {

        listening = false;

        mic.classList.remove(
            "listening"
        );

    };



    recognition.onerror = e => {

        listening = false;

        mic.classList.remove(
            "listening"
        );

        setStatus(
            "Voice error: " + e.error
        );

    };



    recognition.onresult = e => {

        const text =
            e.results[0][0]
            .transcript
            .trim();


        if(!text){

            setStatus(
                "No command detected"
            );

            return;

        }


        lastCommand =
            text;


        commandBox.textContent =
            text;


        processCommand(
            text
        );

    };



    mic.onclick = () => {

        if(listening)
            return;


        try{

            recognition.start();

        }
        catch(e){

            console.log(e);

        }

    };

}



// --------------------------------------------------
// GMAIL KEYWORD DETECTION
// --------------------------------------------------
//
// Gmail requires BOTH:
//
// create
// email
//
// --------------------------------------------------

function isGmail(command){

    const hasCreate =
        /\bcreate\b/i.test(command);


    const hasEmail =
        /\bemail\b/i.test(command);


    return (
        hasCreate &&
        hasEmail
    );

}



// --------------------------------------------------
// YOUTUBE KEYWORD DETECTION
// --------------------------------------------------

function isYouTube(command){

    return (
        /\bplay\b/i.test(command) ||
        /\bsong\b/i.test(command)
    );

}



// --------------------------------------------------
// MAIN COMMAND PROCESSOR
// --------------------------------------------------

async function processCommand(command){


    const gmail =
        isGmail(command);


    const youtube =
        isYouTube(command);



    if(gmail){

        addHistory(command, "email");

        await requestEmail(command, "formal");

        return;

    }


    else if(youtube){

        addHistory(command, "youtube");

        await requestSong(command);

        return;

    }


    else{

        addHistory(command, "other");

        setStatus(
            "Please say 'create email' or 'play song'.",
            true
        );

        return;

    }

}



// --------------------------------------------------
// EMAIL REQUEST
//
// Used for both the first generation and for
// Regenerate — Regenerate just calls this again
// with the next tone in rotation.
// --------------------------------------------------

async function requestEmail(command, tone){

    if(generatingEmail){

        setStatus(
            "Email is already being generated..."
        );

        return;

    }


    generatingEmail = true;

    currentTone = tone;

    setStatus(
        tone === "formal"
            ? "Generating email..."
            : "Regenerating in a " + tone + " tone..."
    );


    try{


        const response =
            await fetch(
                "/agent",
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            command,
                            tone
                        })

                }
            );



        const data =
            await response.json();



        if(
            !response.ok ||
            !data.success
        ){

            throw Error(
                data.message ||
                "Email request failed"
            );

        }


        lastCommand =
            command;


        showEmail(
            data
        );


    }
    catch(error){

        console.error(
            error
        );


        setStatus(
            error.message ||
            "Email generation failed",
            true
        );

    }
    finally{

        generatingEmail = false;

    }

}



// --------------------------------------------------
// SHOW GENERATED EMAIL
// --------------------------------------------------

function showEmail(data){


    recipient.dataset.email =
        data.recipient || "";


    recipient.textContent =
        data.recipient_label
        ? "To: " + data.recipient_label
        : "Recipient not specified";


    subject.value =
        data.subject || "";


    body.value =
        data.body || "";


    toneLabel.textContent =
        "Tone: " + (data.tone || "formal");


    editor.style.display =
        "block";


    setStatus(
        "Email ready. Review or edit it.",
        true
    );

}



// --------------------------------------------------
// OPEN GMAIL
// --------------------------------------------------

$("open").onclick = () => {


    const url =
        "https://mail.google.com/mail/u/0/?" +

        new URLSearchParams({

            view:"cm",

            fs:"1",

            to:
                recipient.dataset.email || "",

            su:
                subject.value,

            body:
                body.value

        });



    const win =
        window.open(
            url,
            "NovaGmail"
        );



    if(!win){

        setStatus(
            "Please allow popups for this site."
        );

    }

};



// --------------------------------------------------
// REGENERATE
//
// Calls Gemini again with the next tone in rotation
// (formal -> friendly -> concise -> formal ...).
// --------------------------------------------------

$("regen").onclick = () => {

    if(!lastCommand){

        setStatus(
            "Nothing to regenerate yet."
        );

        return;

    }


    const nextTone =
        TONES[
            (TONES.indexOf(currentTone) + 1) %
            TONES.length
        ];


    requestEmail(
        lastCommand,
        nextTone
    );

};



// --------------------------------------------------
// YOUTUBE REQUEST
// --------------------------------------------------

async function requestSong(command){

    setStatus(
        "Finding song..."
    );


    try{


        const response =
            await fetch(
                "/youtube/play",
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            command:command
                        })

                }
            );



        const data =
            await response.json();



        if(
            !response.ok ||
            !data.success
        ){

            throw Error(
                data.message ||
                "YouTube request failed"
            );

        }



        playYouTube(
            data
        );


    }
    catch(error){

        console.error(
            error
        );


        setStatus(
            error.message ||
            "YouTube request failed",
            true
        );

    }

}



// --------------------------------------------------
// YOUTUBE PLAYBACK
// --------------------------------------------------

function playYouTube(data){


    if(
        !youtubeTab ||
        youtubeTab.closed
    ){

        youtubeTab =
            window.open(
                data.url,
                "NovaYouTube"
            );

    }
    else{

        youtubeTab.location.href =
            data.url;

        youtubeTab.focus();

    }


    setStatus(
        "Playing",
        true
    );

}


</script>


</body>

</html>
